# Generated fields (name, description, author, branding, runs.main) come from ../brand.json via `npm run brand:sync`.
name: "Mainfast Intact"
description: "Prove merge commits did not silently drop changes from main (dropped hunks, evil merges)."
author: "Mainfast authors"
branding:
  icon: "git-merge"
  color: "blue"
inputs:
  token:
    description: "Token for the check run. GITHUB_TOKEN is enough; needs `checks: write` for a check run, otherwise falls back to job summary + annotations."
    default: ${{ github.token }}
  main-branch:
    description: "Main branch name. Default: intact.main_branch in .mainfast.yml, else the repository default branch."
    default: ""
  config:
    description: "Config file path relative to the working directory, read from the checkout. Default: .mainfast.yml as committed at the base of the change (the PR base commit, or the main branch for a push), so a PR cannot loosen its own check."
    default: ""
  config-token:
    description: "Token that can read the repository named in `extends:` (Pro) when it is private and not this repository. Default: token."
    default: ""
  fail-on:
    description: "Lowest finding level that fails the step: error, warning or notice."
    default: "warning"
  check-run:
    description: "auto (try a check run, fall back to annotations) or false (annotations only)."
    default: "auto"
  working-directory:
    description: "Repository checkout to analyse. Default: GITHUB_WORKSPACE."
    default: ""
  license:
    description: "Mainfast licence key (Pro, or the optional free key): pass your MAINFAST_LICENSE secret. Optional and never needed for public repositories or private ones with up to 5 active contributors; no feature needs it. Checked once per run with Polar (only the key and the organisation id are sent; offline counts as valid). Without a Pro key a larger private repository gets one notice in the job summary; the result is never affected."
    default: ""
outputs:
  status:
    description: "pass, fail, error or skipped"
  findings:
    description: "Number of findings (error + warning + notice)"
  report:
    description: "Path to the JSON report"
runs:
  using: "node24"
  main: "dist/index.cjs"
