# Generated fields (name, description, author, branding, runs.main) come from ../brand.json via `npm run brand:sync`.
name: "Mainfast Intact"
description: "Checks that merge commits did not silently drop changes from main (dropped hunks, evil merges)."
author: "Mainfast authors"
branding:
  icon: "git-merge"
  color: "blue"
inputs:
  token:
    description: "Token for the check run. GITHUB_TOKEN is enough. It needs `checks: write` to post a check run; without it, results go to the job summary and annotations."
    default: ${{ github.token }}
  main-branch:
    description: "Main branch name. Default: intact.main_branch in .mainfast.yml, else the repository default branch."
    default: ""
  config:
    description: "Config file path relative to the working directory, read from the checkout. Default: .mainfast.yml as committed at the base of the change (the PR base commit, or the main branch for a push), so a PR cannot loosen its own check."
    default: ""
  config-token:
    description: "Token that can read the repository named in `extends:` (Pro) when it is private and not this repository. Default: token."
    default: ""
  fail-on:
    description: "Lowest finding level that fails the step: error, warning, notice or off. With off, findings show as annotations and a neutral check run and the step passes; a merge that could not be analyzed still fails."
    default: "off"
  check-run:
    description: "auto (post a check run, or fall back to annotations if that is not allowed) or false (annotations only)."
    default: "auto"
  working-directory:
    description: "Path of the repository checkout to analyze. Default: GITHUB_WORKSPACE."
    default: ""
  license:
    description: "Your Mainfast license key (Pro, or the optional free key), from the MAINFAST_LICENSE secret. Optional: no feature needs it, and public repositories and private ones with up to 5 active contributors never need it. Checked once per run with Polar (only the key and the organization id are sent; if Polar cannot be reached, the key counts as valid). Without a Pro key, a larger private repository gets one notice in the job summary; the result never changes."
    default: ""
outputs:
  status:
    description: "pass, fail, error or skipped"
  findings:
    description: "Number of findings (error + warning + notice)"
  report:
    description: "Path to the JSON report"
runs:
  using: "node24"
  main: "dist/index.cjs"
