name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - run: npm ci
  build:
    runs-on: ubuntu-latest
    steps:
      - run: npm run build
  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - run: npm test
  eslint:
    runs-on: ubuntu-latest
    steps:
      - run: npm run lint
  typecheck:
    needs: [setup]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: npx tsc --noEmit
